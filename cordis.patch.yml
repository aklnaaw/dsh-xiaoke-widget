# ============================================================================
# dsh-xiaoke-widget —— DSH bundle patch
# ============================================================================
# 这是「小克」挂件的挂载声明。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把挂件插入 Web profile 的配置树。
#
# ⚠️ bundle id 与包名都与上游 dsh-whale-widget 保持不同 —— 两者可以同时安装、
#    各挂一只桌宠（路由前缀 /dsh-xiaoke/ 与 /dsh-whale/ 互不冲突）。
#
# 安装方式：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: xiaoke-widget
      name: dsh-xiaoke-widget
